name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}
      - name: Sync environment
        run: uv sync --locked --python ${{ matrix.python-version }}
      - name: Run tests
        run: uv run pytest tests/ -q

  hooks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Sync environment
        run: uv sync --locked
      - name: Run pre-commit hooks
        run: uv run prek run --all-files

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - name: Build wheel and sdist
        run: uv build
      - name: Inspect wheel and sdist
        run: |
          python3 - <<'PY'
          import glob
          import tarfile
          import zipfile

          wheel = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(wheel).namelist()
          assert "biov/assets/identifiers_org_registry.json" in names
          entry_points_name = next(
              n for n in names if n.endswith("dist-info/entry_points.txt")
          )
          entry_points = zipfile.ZipFile(wheel).read(entry_points_name).decode()
          assert "biov = biov.cli:app" in entry_points
          assert "biov-mcp" not in entry_points

          sdist = glob.glob("dist/*.tar.gz")[0]
          sdist_names = tarfile.open(sdist).getnames()
          assert any("identifiers_org_registry.json" in n for n in sdist_names)
          assert any("update_identifiers_registry.py" in n for n in sdist_names)
          print("package inspection passed")
          PY
