name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.9"
          python-version: ${{ matrix.python }}
      - name: Run tests
        run: uv run --locked pytest tests/ -q

  hooks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.9"
          python-version: "3.14"
      - name: Build documentation
        run: uv run --locked mkdocs build --strict
      - name: Run pre-commit hooks
        run: uv run --locked prek run --all-files

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.9"
          python-version: "3.14"
      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          pixi-version: v0.81.0
          run-install: false
      - name: Prepare real global lifecycle prerequisites
        run: |
          uv python install 3.12
          test "$(pixi --version)" = "pixi 0.81.0"
      - name: Build wheel and sdist
        run: uv build
      - name: Inspect wheel and sdist
        run: |
          python3 - <<'PY'
          import configparser
          import glob
          import json
          import tarfile
          import zipfile

          wheel = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(wheel).namelist()
          assert "biov/assets/identifiers_org_registry.json" in names
          for asset in ("environments/pyproject.toml", "environments/pixi.lock", "pixi-LICENSE"):
              assert f"biov/assets/{asset}" in names
          entry_points_name = next(
              n for n in names if n.endswith("dist-info/entry_points.txt")
          )
          entry_points = zipfile.ZipFile(wheel).read(entry_points_name).decode()
          config = configparser.ConfigParser()
          config.read_string(entry_points)
          assert "biov" not in config["console_scripts"]
          assert "biov-rs" not in entry_points
          assert config["console_scripts"]["crisprprimer"] == "crisprprimer.__main__:run"
          assert config["console_scripts"]["biov-azimuth"] == "biov.azimuth:main"
          for asset in ("restriction_enzymes.json", "cfd.mm.scores.cas9.txt", "cfd.pam.scores.cas9.txt"):
              assert f"crisprprimer/{asset}" in names
          assert "crisprprimer/NAU2MSU.json" not in names
          assert "biov/assets/azimuth.Dockerfile" in names
          assert "biov-mcp" not in entry_points
          manifest = json.loads(
              zipfile.ZipFile(wheel).read("biov/assets/artifact_capabilities.json")
          )
          assert set(config["fsspec.specs"]) == set(manifest["namespaces"])
          assert set(config["fsspec.specs"].values()) == {"biov.filesystem:BioVFileSystem"}

          sdist = glob.glob("dist/*.tar.gz")[0]
          sdist_names = tarfile.open(sdist).getnames()
          assert any("identifiers_org_registry.json" in n for n in sdist_names)
          for package_names in (names, sdist_names):
              assert any(n.endswith("/artifact_capabilities.json") for n in package_names)
              assert not any("/api_catalogs/" in n or n.endswith("/catalogs.py") for n in package_names)
          print("package inspection passed")
          PY
      - name: Verify native wheel ownership and RECORD
        run: python3 scripts/check_wheel.py dist/*.whl
      - name: Verify source distribution boundaries
        run: python3 scripts/check_sdist.py dist/*.tar.gz
      - name: Install and exercise wheel outside checkout
        run: |
          uv venv /tmp/biov-wheel
          uv pip install --python /tmp/biov-wheel/bin/python dist/*.whl pytest biopython==1.88
          cd /tmp
          /tmp/biov-wheel/bin/python -c 'import biov; assert biov.reverse_complements(["acgtryn", None, ""], kind="dna") == ["NRYACGT", None, ""]'
          /tmp/biov-wheel/bin/biov --help
          /tmp/biov-wheel/bin/pytest "$GITHUB_WORKSPACE/tests/test_native_sequence.py" "$GITHUB_WORKSPACE/tests/test_native_metrics.py" -q
      - name: Verify unified uv tool installation outside checkout
        run: |
          export UV_TOOL_DIR=/tmp/biov-uv-tools
          export UV_TOOL_BIN_DIR=/tmp/biov-uv-bin
          uv tool install --python 3.14 "$GITHUB_WORKSPACE"/dist/*.whl
          test -x "$UV_TOOL_BIN_DIR/biov"
          test ! -e "$UV_TOOL_BIN_DIR/biov-rs"
          cd /tmp
          BIOV_TEST_BINARY="$UV_TOOL_BIN_DIR/biov" \
            BIOV_TEST_REAL_TOOLS=1 \
            BIOV_TEST_REAL_PIXI="$(command -v pixi)" \
            BIOV_TEST_REAL_UV="$(command -v uv)" \
            BIOV_TEST_TOOL_PYTHON=3.12 \
            BIOV_TEST_WHEEL="$(realpath "$GITHUB_WORKSPACE"/dist/*.whl)" \
            /tmp/biov-wheel/bin/pytest \
            "$GITHUB_WORKSPACE/tests/test_unified_install.py" \
            --basetemp /tmp/biov-live-checkout -q
      - name: Rebuild unpacked source distribution
        run: |
          mkdir /tmp/biov-source
          tar -xf dist/*.tar.gz -C /tmp/biov-source
          cd /tmp/biov-source/biov-*
          cargo test --workspace --locked
          uv build --wheel --out-dir /tmp/biov-source-wheels
          python3 scripts/check_wheel.py /tmp/biov-source-wheels/*.whl
          uv pip install --python /tmp/biov-wheel/bin/python --reinstall /tmp/biov-source-wheels/*.whl biopython==1.88
          cd /tmp
          /tmp/biov-wheel/bin/pytest "$GITHUB_WORKSPACE/tests/test_native_sequence.py" "$GITHUB_WORKSPACE/tests/test_native_metrics.py" -q

      - name: Verify rebuilt source wheel through uv tool
        run: |
          export UV_TOOL_DIR=/tmp/biov-uv-tools
          export UV_TOOL_BIN_DIR=/tmp/biov-uv-bin
          uv tool install --python 3.14 --force --reinstall /tmp/biov-source-wheels/*.whl
          cd /tmp
          BIOV_TEST_BINARY="$UV_TOOL_BIN_DIR/biov" \
            BIOV_TEST_REAL_TOOLS=1 \
            BIOV_TEST_REAL_PIXI="$(command -v pixi)" \
            BIOV_TEST_REAL_UV="$(command -v uv)" \
            BIOV_TEST_TOOL_PYTHON=3.12 \
            BIOV_TEST_WHEEL="$(realpath /tmp/biov-source-wheels/*.whl)" \
            /tmp/biov-wheel/bin/pytest \
            /tmp/biov-source/biov-*/tests/test_unified_install.py \
            --basetemp /tmp/biov-live-sdist -q
      - name: Preserve real upstream lifecycle and scientific evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: upstream-tool-lifecycle-evidence
          path: |
            /tmp/biov-live-*/test_real*/unrelated/evidence/
            /tmp/biov-live-*/test_real*/unrelated/*-goatools/
          if-no-files-found: warn

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.9"
          python-version: "3.12"
      - name: Check pinned Rust workspace
        run: |
          cargo fmt --all -- --check
          cargo test --workspace --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Install native MCP binary and verify outside checkout
        run: |
          cargo install --locked --debug --path crates/biov-cli --root /tmp/biov-native
          cd /tmp
          /tmp/biov-native/bin/biov --help
          BIOV_TEST_BINARY=/tmp/biov-native/bin/biov cargo test --manifest-path "$GITHUB_WORKSPACE/Cargo.toml" -p biov-cli --test mcp_stdio --locked
      - name: Verify moved bundles with standalone PyArrow outside checkout
        run: |
          uv venv /tmp/biov-portability-driver
          uv pip install --python /tmp/biov-portability-driver/bin/python pytest==9.1.1
          uv venv /tmp/biov-standalone-arrow
          uv pip install --python /tmp/biov-standalone-arrow/bin/python pyarrow==25.0.1
          cd /tmp
          BIOV_TEST_BINARY=/tmp/biov-native/bin/biov \
            BIOV_STANDALONE_PYTHON=/tmp/biov-standalone-arrow/bin/python \
            /tmp/biov-portability-driver/bin/python -m pytest \
            "$GITHUB_WORKSPACE/tests/test_native_bundle_portability.py" \
            "$GITHUB_WORKSPACE/tests/test_native_storage_portability.py" -q
      - name: Verify prepared FASTA with independent indexed and sequential readers
        run: |
          uv venv /tmp/biov-standalone-fasta
          uv pip install --python /tmp/biov-standalone-fasta/bin/python pysam==0.24.1 biopython==1.88 numpy==2.5.3
          cd /tmp
          BIOV_TEST_BINARY=/tmp/biov-native/bin/biov \
            BIOV_STANDALONE_FASTA=/tmp/biov-standalone-fasta/bin/python \
            /tmp/biov-portability-driver/bin/python -m pytest \
            "$GITHUB_WORKSPACE/tests/test_prepared_fasta_portability.py" -q
