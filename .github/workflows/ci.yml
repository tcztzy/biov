name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.9"
          python-version: ${{ matrix.python }}
      - name: Run tests
        run: uv run --locked pytest tests/ -q

  hooks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.9"
          python-version: "3.14"
      - name: Build documentation
        run: uv run --locked mkdocs build --strict
      - name: Run pre-commit hooks
        run: uv run --locked prek run --all-files

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.9"
          python-version: "3.14"
      - name: Build wheel and sdist
        run: uv build
      - name: Inspect wheel and sdist
        run: |
          python3 - <<'PY'
          import configparser
          import glob
          import json
          import tarfile
          import zipfile

          wheel = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(wheel).namelist()
          assert "biov/assets/identifiers_org_registry.json" in names
          for asset in ("environments/pyproject.toml", "environments/pixi.lock", "pixi-LICENSE"):
              assert f"biov/assets/{asset}" in names
          entry_points_name = next(
              n for n in names if n.endswith("dist-info/entry_points.txt")
          )
          entry_points = zipfile.ZipFile(wheel).read(entry_points_name).decode()
          assert "biov = biov.cli:app" in entry_points
          assert "crisprprimer = crisprprimer.__main__:run" in entry_points
          assert "biov-azimuth = biov.azimuth:main" in entry_points
          for asset in ("restriction_enzymes.json", "cfd.mm.scores.cas9.txt", "cfd.pam.scores.cas9.txt"):
              assert f"crisprprimer/{asset}" in names
          assert "crisprprimer/NAU2MSU.json" not in names
          assert "biov/assets/azimuth.Dockerfile" in names
          assert "biov-mcp" not in entry_points
          config = configparser.ConfigParser()
          config.read_string(entry_points)
          manifest = json.loads(
              zipfile.ZipFile(wheel).read("biov/assets/artifact_capabilities.json")
          )
          assert set(config["fsspec.specs"]) == set(manifest["namespaces"])
          assert set(config["fsspec.specs"].values()) == {"biov.filesystem:BioVFileSystem"}

          sdist = glob.glob("dist/*.tar.gz")[0]
          sdist_names = tarfile.open(sdist).getnames()
          assert any("identifiers_org_registry.json" in n for n in sdist_names)
          for package_names in (names, sdist_names):
              assert any(n.endswith("/artifact_capabilities.json") for n in package_names)
              assert not any("/api_catalogs/" in n or n.endswith("/catalogs.py") for n in package_names)
          print("package inspection passed")
          PY
      - name: Assert the sdist ships only project files
        run: |
          python3 - <<'PY'
          import re
          import subprocess
          import tarfile
          import tomllib
          from pathlib import Path

          config = tomllib.load(open("pyproject.toml", "rb"))
          metadata = config["project"]
          backend = config["tool"]["uv"]["build-backend"]
          version = metadata["version"]
          sdist = f"dist/biov-{version}.tar.gz"
          # uv_build records the original manifest alongside the resolved one.
          generated = {"PKG-INFO", "pyproject.toml.orig"}

          with tarfile.open(sdist) as archive:
              members = [m for m in archive.getmembers() if not m.isdir()]
              shipped = {m.name.split("/", 1)[1] for m in members if "/" in m.name}
              contents = []
              for member in members:
                  if member.isfile() and (stream := archive.extractfile(member)):
                      contents.append(stream.read())

          project = set(
              subprocess.run(
                  ["git", "ls-files", "-z", "-co", "--exclude-standard"],
                  capture_output=True,
                  text=True,
                  check=True,
              ).stdout.split("\0")
          ) - {""}

          patterns = [
              *(f"src/{module}/**/*" for module in backend["module-name"]),
              *metadata["license-files"],
              *backend["source-include"],
          ]
          # Python 3.12 treats a trailing ** as directories only. Expand
          # recursive contents explicitly to match uv_build on every runner.
          selected = {"pyproject.toml", metadata["readme"]} | {
              path.as_posix()
              for pattern in patterns
              for path in Path().glob(pattern + "/*" if pattern.endswith("/**") else pattern)
              if path.is_file()
          }
          excluded = {
              path.as_posix()
              for pattern in backend["source-exclude"]
              for path in Path().glob(pattern + "/*" if pattern.endswith("/**") else pattern)
              if path.is_file()
          }
          expected = project & (selected - excluded)
          assert shipped - generated == expected, (
              f"sdist project mismatch: missing={sorted(expected - shipped)}, "
              f"unexpected={sorted(shipped - generated - expected)}"
          )
          # `uv build` derives the inspected wheel from this sdist, so the
          # wheel assertions above already prove the sdist is self-contained.
          # SPEC V60: packaged metadata carries no workstation-specific paths.
          # The alternation keeps this pattern from matching its own source.
          workstation = re.compile(rb"/(?:Users|Volumes)/")
          assert not any(workstation.search(body) for body in contents), (
              "sdist contains workstation-specific paths"
          )
          print(f"sdist ships exactly the {len(expected)} selected project files")
          PY
