# GOATOOLS owns GO parsing and enrichment statistics; this environment only
# manages its upstream CLI independently of the generic Python/TxGNN stacks.
[tool.pixi.feature.goatools.dependencies]
python = "3.12.*"

[tool.pixi.feature.goatools.pypi-dependencies]
goatools = "==1.6.5"
# GOATOOLS 1.6.5 imports sandbox.stats.multicomp.multipletests, removed in 0.15.
statsmodels = "==0.14.6"

[tool.pixi.feature.goatools.tasks]
goatools = 'cd "$INIT_CWD" && goatools'

[tool.pixi.feature.r.dependencies]
cxx-compiler = "*"
fortran-compiler = "*"
make = "*"
curl = "*"
coreutils = "*"
bash = "*"
r-rcpp = "*"
r-rcpparmadillo = "*"
r-rcppeigen = "*"
r-base = "4.5.*"
bioconductor-deseq2 = "*"
bioconductor-edger = "*"
bioconductor-limma = "*"
r-susier = "*"
r-seurat = "*"

[tool.pixi.feature.r.tasks]
r = 'cd "$INIT_CWD" && Rscript'
# ponytail: rebuild source R packages on setup; cache by hash if rebuilds become costly.
prepare = { cmd = ["bash", "-c", "set -eu\nmkdir -p sources/r\ncurl --fail --location https://cran.r-project.org/src/contrib/MASS_7.3-66.tar.gz --output sources/r/MASS_7.3-66.tar.gz\necho \"59c619c70bfca653f1c74aef880e69405daefd0134e716a1862ecc5334b4e155  sources/r/MASS_7.3-66.tar.gz\" | sha256sum --check --strict\nMAKEFLAGS=-j2 R CMD INSTALL sources/r/MASS_7.3-66.tar.gz\ncurl --fail --location https://cran.r-project.org/src/contrib/RcppProgress_0.4.2.tar.gz --output sources/r/RcppProgress_0.4.2.tar.gz\necho \"b1624b21b7aeb1dafb30f092b2a4bef4c3504efd2d6b00b2cdf55dc9df194b48  sources/r/RcppProgress_0.4.2.tar.gz\" | sha256sum --check --strict\nMAKEFLAGS=-j2 R CMD INSTALL sources/r/RcppProgress_0.4.2.tar.gz\ncurl --fail --location https://cran.r-project.org/src/contrib/enhancer_1.1.1.tar.gz --output sources/r/enhancer_1.1.1.tar.gz\necho \"8f7df18144d8850299065899b9547eff69bfb01fdede764817da12a2ffd59648  sources/r/enhancer_1.1.1.tar.gz\" | sha256sum --check --strict\nMAKEFLAGS=-j2 R CMD INSTALL sources/r/enhancer_1.1.1.tar.gz\ncurl --fail --location https://cran.r-project.org/src/contrib/sommer_4.4.7.tar.gz --output sources/r/sommer_4.4.7.tar.gz\necho \"43b10dec7e8ef8249e95e0aeb2b62bc32d7b9111ef0971cc16fff9d44b1666cf  sources/r/sommer_4.4.7.tar.gz\" | sha256sum --check --strict\nMAKEFLAGS=-j2 R CMD INSTALL sources/r/sommer_4.4.7.tar.gz\n"] }

