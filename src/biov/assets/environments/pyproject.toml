# Inference dependencies follow sources/diffdock/environment.yml at the pinned
# prepare revision. OpenFold needs Torch and CUDA headers before PyPI resolution.
[tool.pixi.feature.diffdock]
channels = ["pytorch", "nvidia/label/cuda-11.7.1", "conda-forge"]

[tool.pixi.feature.diffdock.dependencies]
python = "3.9.18.*"
git = "*"
prody = "2.2.0.*"
scipy = "1.12.*"
pytorch = "1.13.1.*"
pytorch-cuda = "11.7.*"
# Older Torch binaries require the iJIT symbols removed in MKL 2024.1.
mkl = "<2024.1"
cuda-nvcc = "11.7.*"
cuda-libraries-dev = "11.7.*"
gxx_linux-64 = "11.*"
setuptools = "69.5.1.*"
wheel = "*"

[tool.pixi.feature.diffdock.pypi-options]
no-build-isolation = ["deepspeed", "openfold"]

[tool.pixi.feature.diffdock.pypi-dependencies]
e3nn = "==0.5.1"
fair-esm = { version = "==2.0.0", extras = ["esmfold"] }
networkx = "==2.8.4"
pandas = "==1.5.1"
rdkit = "==2022.3.3"
scikit-learn = "==1.1.0"
pybind11 = "==2.11.1"
pytorch-lightning = "==1.9.5"
torchmetrics = "==0.11.0"
torch-geometric = "==2.2.0"
torch-scatter = { url = "https://data.pyg.org/whl/torch-1.13.0%2Bcu117/torch_scatter-2.1.0%2Bpt113cu117-cp39-cp39-linux_x86_64.whl" }
torch-cluster = { url = "https://data.pyg.org/whl/torch-1.13.0%2Bcu117/torch_cluster-1.6.0%2Bpt113cu117-cp39-cp39-linux_x86_64.whl" }
torch-sparse = { url = "https://data.pyg.org/whl/torch-1.13.0%2Bcu117/torch_sparse-0.6.16%2Bpt113cu117-cp39-cp39-linux_x86_64.whl" }
torch-spline-conv = { url = "https://data.pyg.org/whl/torch-1.13.0%2Bcu117/torch_spline_conv-1.2.1%2Bpt113cu117-cp39-cp39-linux_x86_64.whl" }
openfold = { git = "https://github.com/aqlaboratory/openfold.git", rev = "4b41059694619831a7db195b7e0988fc4ff3a307" }
dllogger = { git = "https://github.com/NVIDIA/dllogger.git", rev = "0478734ff7be75adde8d160e04872664d1c62e5f" }
pyyaml = "*"
requests = "*"
[tool.pixi.feature.diffdock.tasks]
diffdock = 'cd "$INIT_CWD" && python "$PIXI_PROJECT_ROOT/sources/diffdock/inference.py" --config "$PIXI_PROJECT_ROOT/sources/diffdock/default_inference_args.yaml"'
prepare = "git init sources/diffdock && git -C sources/diffdock fetch --depth 1 https://github.com/gcorso/DiffDock.git 85c49b60d3e0b0182a59ee43a34a6d7036981284 && git -C sources/diffdock checkout --detach FETCH_HEAD"
[tool.pixi.feature.txgnn.dependencies]
python = "3.10.*"
git = "*"
[tool.pixi.feature.txgnn.pypi-dependencies]
txgnn = { git = "https://github.com/mims-harvard/TxGNN.git", rev = "0e0203c3939f7d12da27aaf10e55daaff5424023" }
torch = "==2.0.1"
dgl = "==1.1.2"
numpy = "<2"

[tool.pixi.feature.txgnn.tasks]
txgnn = 'cd "$INIT_CWD" && python'

[tool.pixi.feature.autosite.dependencies]
openssl = "*"
ca-certificates = "*"
python = "3.11.*"
curl = "*"
tar = "*"
coreutils = "*"
bash = "*"
[tool.pixi.feature.autosite.tasks]
autosite = 'cd "$INIT_CWD" && "$PIXI_PROJECT_ROOT/sources/adfr/bin/autosite"'
prepare = { cmd = ["bash", "-c", "set -eu\nmkdir -p sources/adfr-installer\ncurl --fail --location https://letsencrypt.org/certs/gen-y/int-yr1.pem --output sources/yr1.pem\ncurl --fail --location https://letsencrypt.org/certs/gen-y/root-yr-by-x1.pem --output sources/yr-by-x1.pem\nprintf '%s\\n' 'd5efc243446ef865c0e165eb1958a2f068c9514aa17238701bd6f7ad90253ce7  sources/yr1.pem' 'b3858d7a4d598b4ab6ed2892a1b8c0ee035154876dd40a082a3b05387eea11a4  sources/yr-by-x1.pem' | sha256sum --check --strict\nopenssl verify -CAfile \"$CONDA_PREFIX/ssl/cacert.pem\" -untrusted sources/yr-by-x1.pem sources/yr1.pem\ncat \"$CONDA_PREFIX/ssl/cacert.pem\" sources/yr1.pem sources/yr-by-x1.pem > sources/ca-chain.pem\ncurl --cacert sources/ca-chain.pem --fail --location https://ccsb.scripps.edu/adfr/download/1038/ --output sources/adfr.tar.gz\necho '66539864ffb7ba87728d52ee50dde78586f551c7ca96aa455dae761875faf7e4  sources/adfr.tar.gz' | sha256sum --check --strict\ntar -xzf sources/adfr.tar.gz -C sources/adfr-installer --strip-components=1\ncd sources/adfr-installer\nprintf 'N\\n' | bash install.sh -d \"$PWD/../adfr\" -c 0"], outputs = ["sources/adfr/bin/pythonsh"], inputs = [] }
