# Scientific dependencies and entry points use native Pixi tables.
[tool.pixi.workspace]
channels = ["https://conda.anaconda.org/conda-forge", "https://conda.anaconda.org/bioconda"]
platforms = ["linux-64"]
requires-pixi = "==0.81.0"

[tool.pixi.feature.samtools.dependencies]
samtools = "*"

[tool.pixi.feature.bcftools.dependencies]
bcftools = "*"

[tool.pixi.feature.snpeff.dependencies]
