# Managed by prek: https://prek.j178.dev/
# Hook catalog: https://pre-commit.com/hooks.html
repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
    -   id: trailing-whitespace
        exclude: renv/activate.R
    -   id: end-of-file-fixer
        # Machine-managed upstream response body; bytes must stay identical to
        # what `biov update-identifiers-registry` writes (SPEC V26/V46).
        exclude: ^src/biov/assets/identifiers_org_registry\.json$
    -   id: check-yaml
    -   id: check-added-large-files
        exclude: ^src/biov/assets/identifiers_org_registry\.json$
-   repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.5
    hooks:
    -   id: ruff
        args: [--fix]
        exclude: tests/.+\.py$
    -   id: ruff-format
-   repo: https://github.com/astral-sh/ty-pre-commit
    # ty version.
    rev: v0.0.75
    hooks:
    -   id: ty
-   repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.3.1
    hooks:
    -   id: mypy
        additional_dependencies:
        -   pydantic-settings
-   repo: https://github.com/RobertCraigie/pyright-python
    rev: v1.1.411
    hooks:
    -   id: pyright
