[package]
name = "biov-prepared"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
biov-core = { path = "../biov-core" }
biov-identifiers = { path = "../biov-identifiers" }
biov-storage = { path = "../biov-storage" }
noodles-core = "=0.20.0"
noodles-fasta = "=0.66.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
schemars = "=1.2.2"
sha2 = "=0.10.9"
thiserror = "=2.0.21"
tempfile = "=3.27.0"
fs4 = { version = "=0.13.1", default-features = false, features = ["sync"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "=1.1.5", features = ["fs"] }

[dev-dependencies]
md-5 = "=0.10.6"
